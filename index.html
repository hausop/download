<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>保單大賽證明下載</title>

   <meta
    name="theme-color"
    content="#00a0e9">

    <meta
    name="mobile-web-app-capable"
    content="yes">

<meta
    name="apple-mobile-web-app-capable"
    content="yes">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

<meta
    name="apple-mobile-web-app-title"
    content="保單證明">

<link
    rel="icon"
    href="icons/favicon.ico">

<link
    rel="apple-touch-icon"
    href="icons/apple-touch-icon.png">
    
    <link
    rel="mask-icon"
    href="icons/icon-512.png"
    color="#00a0e9">

<link
    rel="manifest"
    href="manifest.json">

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/mobile.css">

    <link
        rel="stylesheet"
        href="css/dark.css">

</head>

<body>

<div class="page">

    <header>

        <h1>保單大賽獎狀證明下載</h1>

        <p class="subtitle">
            PDF以組為單位提供<br>
請同學可自行列印或刪減頁面轉存，恕不開放編輯
        </p>

    </header>

    <main>

        <section class="search-card">

            <input
                id="school"
                type="text"
                placeholder="請輸入學校">

            <input
                id="team"
                type="text"
                placeholder="請輸入隊名">

            <button id="searchBtn">
                <span>🔍 查詢</span>
            </button>

            <hr class="section-divider">

<section class="guide-section">

    <a
        href="javascript:void(0)"
        id="guideBtn"
        class="file-link">

        全國參賽學校證明.pdf

    </a>

</section>

<hr class="section-divider">

<section id="result"></section>

<hr class="section-divider">

        </section>

    </main>

    <p class="notice">
    只提供當屆參賽隊伍<br>
    ※檔案提供時段:總決賽後一個月內~下屆報名初賽日截止
</p>

</div>

<script src="js/api.js"></script>
<script src="js/download.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

    <script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("service-worker.js")
        .then(() => {

            console.log("Service Worker 已註冊");

        })
        .catch(err => {

            console.error("Service Worker 註冊失敗：", err);

        });

    });

}

</script>

    
</body>

</html>
