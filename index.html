<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>保單大賽證明下載</title>

    <meta
        name="theme-color"
        content="#2563eb">

    <link

    <link

    <link
        rel="stylesheet"
        href="css/mobile.css">

    <link

            <button id="searchBtn">

            <div class="guide-link">

                <a
                    href="javascript:void(0)"

                    📄 全國參賽學校證明下載

            <section id="result"></section>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/download.js"></script>
<script src="js/search.js"></script>

</html>
